name: baseline_finetune
seed: 0
model:
  foundation_checkpoint: ./checkpoints/foundation.model
data:
  train_batches_pt: ./data/new_domain_train_batches.pt
  # valid_batches_pt: ./data/new_domain_valid_batches.pt
budget:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  scheduler: none
  scheduler_params: {}
  max_steps: 200
  batch_size: 1
  valid_batch_size: 1
  grad_accum_steps: 1
  mixed_precision: false
  early_stopping:
    patience: 0
    metric: valid_loss
baselines:
  - full_ft
  - head_only
  - l2sp
# - lora  # optional; falls back to full_ft semantics if enabled
l2sp_lambda: 1.0
