name: baseline_finetune
seed: 123
model:
  foundation_model: small
data:
  train_file: ./data/new_domain_train.extxyz
  valid_file: ./data/new_domain_valid.extxyz
budget:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  scheduler: ReduceLROnPlateau
  scheduler_params: {}
  max_steps: 50
  batch_size: 8
  valid_batch_size: 8
  grad_accum_steps: 1
  mixed_precision: false
  early_stopping:
    patience: 10
    metric: valid_loss
baselines:
  - full_ft
  - head_only
  - l2sp
  - lora
l2sp_lambda: 1.0
